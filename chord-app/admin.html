<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>ChordSathi কোড</title>
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<style>
:root{--bg:#121214;--surface:#1a1a1e;--surface-2:#232329;--line:#2f2f36;--fg:#f3f0ea;--muted:#9b978f;--accent:#ffb547;--accent-ink:#1a1305;--good:#4ade80;--danger:#fda29b;color-scheme:dark;
  --f:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--f)}
.wrap{max-width:720px;margin:0 auto;padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
h1{font-size:22px;margin:0} h2{font-size:16px;margin:0 0 10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px}
label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);font-weight:600}
input,select,textarea{font:inherit;color:var(--fg);background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%}
textarea{font-family:var(--mono);font-size:12.5px;min-height:70px;resize:vertical}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);font:600 14px var(--f);cursor:pointer;text-decoration:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)} .small{font-size:12.5px} .ok{color:var(--good)} .bad{color:var(--danger)}
.hidden{display:none!important}
table{width:100%;border-collapse:collapse;font-size:13px} th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line)} th{color:var(--muted);font-weight:600}
.tw{overflow-x:auto}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
</style>
</head>
<body>
<div class="wrap">
  <div><h1>ChordSathi · আনলক কোড বানাও</h1><p class="muted small" style="margin:4px 0 0">এই পেজ শুধু তোমার জন্য। কোড এই ফোন/কম্পিউটারেই তৈরি হয়, কোথাও পাঠানো হয় না।</p></div>

  <section class="card" id="lockCard">
    <h2>ধাপ ১ · পাসওয়ার্ড দাও</h2>
    <form id="unlockForm" class="row">
      <input id="pass" type="password" placeholder="তোমার পাসওয়ার্ড" autocomplete="current-password" style="flex:1;min-width:200px">
      <button class="btn primary" type="submit">খোলো</button>
    </form>
    <label class="row small" style="flex-direction:row;margin-top:10px;font-weight:500"><input type="checkbox" id="remember" style="width:auto" checked> এই ফোন/কম্পিউটারে মনে রাখো (পরের বার আর পাসওয়ার্ড লাগবে না)</label>
    <p id="unlockMsg" class="small"></p>
  </section>

  <section class="card hidden" id="genCard">
    <h2>ধাপ ২ · নতুন আনলক কোড বানাও</h2>
    <form id="genForm" style="display:flex;flex-direction:column;gap:12px">
      <div class="grid">
        <label>যে টাকা দিয়েছে তার নাম<input id="buyer" required placeholder="যেমন: Rahul Das" maxlength="40"></label>
        <label>তার WhatsApp নম্বর (না দিলেও চলবে)<input id="phone" placeholder="যেমন: 919800000000" inputmode="numeric"></label>
        <label>কত টাকা দিয়েছে<select id="plan"><option value="m">₹99 · ১ মাস</option><option value="y" selected>₹1000 · ১ বছর</option><option value="c">নিজে দিন ঠিক করবো</option></select></label>
        <label id="daysWrap" class="hidden">কত দিন<input id="days" type="number" min="1" max="3660" value="7"></label>
        <label>কবে থেকে চালু (আজকের তারিখ থাকুক)<input id="start" type="date"></label>
      </div>
      <div class="row"><button class="btn primary" type="submit">কোড বানাও</button><button class="btn" type="button" id="lockBtn">বন্ধ করো</button></div>
    </form>
    <div id="out" class="hidden" style="margin-top:16px;display:flex;flex-direction:column;gap:10px">
      <p class="small ok" id="outInfo" style="margin:0"></p>
      <label>আনলক কোড<textarea id="outCode" readonly></textarea></label>
      <label>ধাপ ৩ · এই মেসেজটা ক্রেতাকে পাঠাও (লিঙ্কে চাপলেই অ্যাপ খুলে যাবে)<textarea id="outMsg" readonly style="min-height:110px"></textarea></label>
      <div class="row"><a class="btn primary hidden" id="sendWa" target="_blank" rel="noopener">WhatsApp-এ পাঠাও</a><button class="btn" id="copyMsg">মেসেজ কপি করো</button><button class="btn" id="copyCode">শুধু কোড কপি করো</button></div>
    </div>
  </section>

  <section class="card hidden" id="histCard">
    <h2>আগে যাদের কোড দিয়েছো</h2>
    <div class="tw"><table><thead><tr><th>কবে দিয়েছো</th><th>নাম</th><th>প্ল্যান</th><th>কত দিন পর্যন্ত</th><th></th></tr></thead><tbody id="hist"></tbody></table></div>
    <p class="muted small" id="histEmpty">এখনও কোনো কোড বানাওনি।</p>
  </section>
</div>
<script>
"use strict";
const VAULT={"salt": "ylsfVjL2mRnZwafM+Hm2ng==", "iv": "Om650KGBD9Si24LW", "ct": "p9nnN1cMCeJorzt8pgprXM4qBihqx85GEwSZYOpsnoFJLYZ1BX75OE2IlFKY3p8NTYOwMjP+gWg/sqz2cno1qbUSEmHnX/3zhuD0/XsRlL+PCX6JlbiJuZDvucvEKLLKezLfvPRuCJTEw9eg6MmxF1nBRlDaYW7XHknj65nEjgQNi+W6os99gxHjW8uNsezqIktsaVFZBxBPl5iXke+ubC8it/LEkirjUjDGy/OSx2TWUML+DdmqmnWuG+D+JSphoPA7JFcxUatwcjTw9eX2CvFOQPUNzokpWBYQTzzc", "iter": 310000};
const DAY=86400000, APP_URL=new URL('./',location.href).href;
const $=id=>document.getElementById(id);
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},del:k=>{try{localStorage.removeItem(k)}catch(e){}}};
const b64=u=>btoa(String.fromCharCode(...u)), unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const b64u=u=>b64(u).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
let signKey=null;
async function unlock(pass){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);
  const aes=await crypto.subtle.deriveKey({name:'PBKDF2',salt:unb64(VAULT.salt),iterations:VAULT.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const jwk=JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(VAULT.iv)},aes,unb64(VAULT.ct))));
  return {jwk,key:await crypto.subtle.importKey('jwk',jwk,{name:'ECDSA',namedCurve:'P-256'},false,['sign'])};
}
function showGen(){ $('lockCard').classList.add('hidden'); $('genCard').classList.remove('hidden'); $('histCard').classList.remove('hidden'); renderHist(); }
$('unlockForm').onsubmit=async e=>{ e.preventDefault(); $('unlockMsg').textContent='খুলছে… একটু অপেক্ষা করো'; $('unlockMsg').className='small';
  try{ const r=await unlock($('pass').value.trim()); signKey=r.key; if($('remember').checked) ls.set('cs-admin-key',JSON.stringify(r.jwk)); $('pass').value=''; showGen(); }
  catch(err){ $('unlockMsg').textContent='পাসওয়ার্ড ভুল। বানান আর মাঝের ড্যাশ (-) ঠিক আছে কিনা দেখো।'; $('unlockMsg').className='small bad'; } };
$('lockBtn').onclick=()=>{ signKey=null; ls.del('cs-admin-key'); location.reload(); };
(async()=>{ const saved=ls.get('cs-admin-key'); if(saved){ try{ signKey=await crypto.subtle.importKey('jwk',JSON.parse(saved),{name:'ECDSA',namedCurve:'P-256'},false,['sign']); showGen(); }catch(e){ ls.del('cs-admin-key'); } } })();
const today=new Date(); $('start').value=today.toISOString().slice(0,10);
$('plan').onchange=()=>$('daysWrap').classList.toggle('hidden',$('plan').value!=='c');
const fmtDay=d=>new Date(d*DAY).toLocaleDateString('bn-IN',{day:'numeric',month:'long',year:'numeric'});
$('genForm').onsubmit=async e=>{
  e.preventDefault(); if(!signKey) return;
  const n=$('buyer').value.trim().slice(0,40), p=$('plan').value;
  const len=p==='m'?31:p==='y'?366:Math.max(1,Math.min(3660,+$('days').value||1));
  const i=Math.floor(new Date($('start').value+'T00:00:00Z').getTime()/DAY), ex=i+len-1;
  const data=new TextEncoder().encode(JSON.stringify({n,p,i,e:ex}));
  const sig=new Uint8Array(await crypto.subtle.sign({name:'ECDSA',hash:'SHA-256'},signKey,data));
  const code='CS-'+b64u(data)+'.'+b64u(sig), link=APP_URL+'?code='+encodeURIComponent(code);
  const planName=p==='y'?'১ বছর':p==='m'?'১ মাস':`${len} দিন`;
  const msg=`নমস্কার ${n}! ChordSathi Pro (${planName}) নেওয়ার জন্য ধন্যবাদ। 🎸\n\nএই লিঙ্কে চাপলেই অ্যাপ চালু হয়ে যাবে:\n${link}\n\nঅথবা অ্যাপ খুলে উপরের Pro বোতামে চেপে এই কোডটা বসাও:\n${code}\n\n${fmtDay(ex)} পর্যন্ত চলবে।`;
  $('outInfo').textContent=`✅ ${n}-এর কোড তৈরি · ${planName} · ${fmtDay(ex)} পর্যন্ত চলবে`;
  $('outCode').value=code; $('outMsg').value=msg; $('out').classList.remove('hidden');
  const ph=$('phone').value.replace(/\D/g,'');
  $('sendWa').classList.toggle('hidden',!ph); if(ph) $('sendWa').href=`https://wa.me/${ph}?text=${encodeURIComponent(msg)}`;
  const h=JSON.parse(ls.get('cs-admin-hist')||'[]'); h.unshift({c:Date.now(),n,p:planName,e:ex,code}); ls.set('cs-admin-hist',JSON.stringify(h.slice(0,500))); renderHist();
};
const copy=(id,btn)=>{ const v=$(id).value; (navigator.clipboard?navigator.clipboard.writeText(v):Promise.reject()).then(()=>{btn.textContent='কপি হয়েছে ✓';setTimeout(()=>btn.textContent=btn.dataset.t,1500);},()=>{ $(id).select(); }); };
$('copyCode').dataset.t='শুধু কোড কপি করো'; $('copyMsg').dataset.t='মেসেজ কপি করো';
$('copyCode').onclick=()=>copy('outCode',$('copyCode')); $('copyMsg').onclick=()=>copy('outMsg',$('copyMsg'));
function renderHist(){
  const h=JSON.parse(ls.get('cs-admin-hist')||'[]'), tb=$('hist'); tb.innerHTML='';
  $('histEmpty').classList.toggle('hidden',h.length>0);
  h.forEach(r=>{ const tr=document.createElement('tr');
    [new Date(r.c).toLocaleDateString(),r.n,r.p,fmtDay(r.e)].forEach((v,k)=>{ const td=document.createElement('td'); td.textContent=v; if(k!==1) td.className='num'; tr.appendChild(td); });
    const td=document.createElement('td'), b=document.createElement('button'); b.className='btn'; b.style.height='30px'; b.textContent='কোড কপি';
    b.onclick=()=>navigator.clipboard&&navigator.clipboard.writeText(r.code).then(()=>b.textContent='কপি হয়েছে ✓'); td.appendChild(b); tr.appendChild(td); tb.appendChild(tr); });
}
</script>
</body>
</html>
