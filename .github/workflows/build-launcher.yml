name: Build Glass Launcher APK

on:
  push:
    paths: ['glass-launcher/**', '.github/workflows/build-launcher.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: glass-launcher
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk GlassLauncher.apk
      - uses: actions/upload-artifact@v4
        with:
          name: GlassLauncher-apk
          path: glass-launcher/GlassLauncher.apk
      - name: Publish downloadable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: glass-launcher-build-${{ github.run_number }}
          name: Glass Launcher (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: glass-launcher/GlassLauncher.apk
          body: |
            Glass Launcher for Galaxy Tab S10 Lite — install GlassLauncher.apk on the tablet.
            Built from ${{ github.ref_name }} @ ${{ github.sha }}.
