# Netlify hosts ONLY the Mehendi by Trisha website (from its own folder).
# ChordSathi is separate and stays on GitHub Pages.
[build]
  base = "mehendi-by-trisha"
  command = "npm run build"
  publish = "dist"
  # With a base directory set, Netlify skips builds when nothing in it changed,
  # so edits to ChordSathi or other folders never trigger a Mehendi rebuild.

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
