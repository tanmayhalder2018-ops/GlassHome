# Netlify hosts ONLY the Mehendi by Trisha website (from its own folder).
# ChordSathi is separate and stays on GitHub Pages.
[build]
  base = "mehendi-by-trisha"
  command = "npm run build"
  publish = "dist"
  # Only rebuild when the Mehendi site (or this file) changes — ChordSathi edits never trigger it.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ../netlify.toml"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
